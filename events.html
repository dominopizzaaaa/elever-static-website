<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Élever organises badminton carnivals, clinics and competitions as a service for companies, schools, community clubs and organisations in Singapore. Request a proposal." />

  <meta property="og:description" content="Élever organises badminton carnivals, clinics and competitions as a service for companies, schools and community clubs in Singapore." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.eleverbadminton.com/assets/img/events/asics-summit-2026-1.jpg" />
  <meta name="twitter:description" content="Élever organises badminton carnivals, clinics and competitions as a service for companies, schools and community clubs in Singapore." />
  <meta name="twitter:title" content="Badminton Events for Companies &amp; Schools — Élever Badminton" />
  <meta property="og:image" content="https://www.eleverbadminton.com/assets/img/events/asics-summit-2026-1.jpg" />
  <meta property="og:url" content="https://www.eleverbadminton.com/events" />
  <link rel="canonical" href="https://www.eleverbadminton.com/events" />
  <link rel="icon" type="image/png" href="assets/img/brand/eb-icon-black.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=36" />
  <link rel="stylesheet" href="assets/css/pages.css?v=36" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Badminton Event Management in Singapore",
      "description": "Badminton carnivals, clinics and competitions organised for companies, schools, community clubs and organisations in Singapore.",
      "provider": { "@type": "Organization", "name": "Élever Badminton", "url": "https://www.eleverbadminton.com/" },
      "areaServed": "Singapore",
      "serviceType": "Corporate and community badminton event management"
    }
  </script>
</head>
<body data-page="events" data-nav="solid" data-base="">

  <a href="#main" class="skip-link">Skip to main content</a>
  <header id="siteHeader"></header>

  <main id="main">
    <section class="phead">
      <div class="phead__inner">
        <h1><em>Events</em>.</h1>
      </div>
    </section>

    <!-- ===== OUR SERVICES =====
         "Our Services" is a quiet label above the three cards; Carnivals,
         Clinics and Competitions carry the weight (client, Sep 2026), and the
         three repeated "Request a proposal" buttons are consolidated into the
         single CTA below the row. -->
    <section class="psec">
      <div class="psec__head psec__head--minor">
        <h2>Our Services</h2>
      </div>
      <div class="etypes" id="eventTypes"></div>
      <div class="etypes__cta">
        <a class="btn btn--primary" href="contact.html">Request a proposal</a>
      </div>
    </section>

    <!-- ===== TRUSTED BY =====
         One row of logos that scrolls continuously, the same moving treatment
         as the Home page marquee (client, Sep 2026). pages.js duplicates the
         logo set so the loop has no visible seam. -->
    <section class="psec psec--alt psec--tight">
      <div class="psec__inner">
        <div class="psec__head">
          <h2>Trusted by</h2>
        </div>
      </div>
      <div class="logorail" aria-label="Organisations we have worked with">
        <div class="logorail__track" id="eventPartners"></div>
      </div>
    </section>

    <!-- The "Service provided / Plan, run and wrap." section was removed at the
         client's request (Aug 2026). EVENT_SERVICES is still in data.js. -->

    <!-- ===== OUR WORK ===== -->
    <section class="psec" id="work">
      <div class="psec__head">
        <h2>Upcoming Events</h2>
      </div>
      <div class="ecards" id="eventsUpcoming"></div>

      <div class="psec__head psec__head--spaced" id="past">
        <h2>Past Events</h2>
      </div>
      <!-- Filter chips are rendered by pages.js from the types actually
           present. The Our Services cards link here with #past-carnivals /
           #past-clinics / #past-competitions, which preselects a chip
           (client, Sep 2026). -->
      <div class="sched__controls" id="showcaseFilters" role="group" aria-label="Filter past events by type"></div>
      <div class="eshowcase" id="eventShowcase"></div>

      <!-- The "Previously" log of past events was removed at the client's
           request (Aug 2026). EVENTS_PAST is still in data.js. -->
    </section>

  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/js/data.js?v=36"></script>
  <script src="assets/js/site.js?v=36"></script>
  <script src="assets/js/pages.js?v=36"></script>
  <script src="assets/js/main.js?v=36"></script>
</body>
</html>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "Badminton Event Management in Singapore",
      "description": "Badminton carnivals, clinics and competitions organised for companies, schools, community clubs and organisations in Singapore.",
      "provider": { "@type": "Organization", "name": "Élever Badminton", "url": "https://www.eleverbadminton.com/" },

      "serviceType": "Corporate and community badminton event management"

<body data-page="events" data-nav="solid" data-base="">

  <a href="#main" class="skip-link">Skip to main content</a>
  <header id="siteHeader"></header>

  <main id="main">
    <section class="phead">
      <div class="phead__inner">
        <h1>Events</h1>
      </div>
    </section>

    <!-- ===== OUR SERVICES =====
         "Our Services" is a quiet label above the three cards; Carnivals,
         Clinics and Competitions carry the weight (client, Sep 2026), and the
         three repeated proposal buttons are consolidated into the single
         single CTA below the row. -->
    <section class="psec">
      <div class="psec__head psec__head--minor">
        <h2>Our Services</h2>
      </div>
      <div class="etypes" id="eventTypes"></div>
      <div class="etypes__cta">
        <a class="btn btn--primary" href="https://wa.me/6589214221?text=Hi%2C%20I%20am%20interested%20in%20working%20with%20%C3%89lever%20Badminton%20to%20organise%20an%20event.%20Could%20you%20share%20more%20about%20the%20options%20available%20and%20how%20we%20can%20get%20started%3F%20Thank%20you!" target="_blank" rel="noopener">Work with us</a>
      </div>

      <!-- The client wanted Trusted by visually related to the services above.
           It stays in the same content section, separated by a content-width
           rule rather than a full-screen band. -->
      <div class="trusted-inline">
        <div class="psec__head">
          <h2>Trusted by</h2>
        </div>
        <div class="logorail" aria-label="Organisations we have worked with">
          <div class="logorail__track" id="eventPartners"></div>
        </div>
      </div>
    </section>

    <!-- The "Service provided / Plan, run and wrap." section was removed at the
         client's request (Aug 2026). EVENT_SERVICES is still in data.js. -->

    <!-- ===== OUR WORK ===== -->
    <section class="psec" id="work">
      <div class="psec__head">
        <h2>Upcoming Events</h2>
      </div>
      <div class="ecards" id="eventsUpcoming"></div>

      <div class="psec__head psec__head--spaced" id="past">
        <h2>Past Events</h2>
      </div>
      <!-- Filter chips are rendered by pages.js from the types actually
           present. The Our Services cards link here with #past-carnivals /
           #past-clinics / #past-competitions, which preselects a chip
           (client, Sep 2026). -->
      <div class="sched__controls" id="showcaseFilters" role="group" aria-label="Filter past events by type"></div>
      <div class="eshowcase" id="eventShowcase"></div>

      <!-- The "Previously" log of past events was removed at the client's
           request (Aug 2026). EVENTS_PAST is still in data.js. -->
    </section>

  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/js/data.js?v=59"></script>
  <script src="assets/js/site.js?v=59"></script>
  <script src="assets/js/pages.js?v=59"></script>
  <script src="assets/js/main.js?v=59"></script>
</body>

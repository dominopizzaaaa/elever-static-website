    <main id="main">
      <!-- ===== HERO ===== -->
      <section class="hero" id="top">
        <!-- Hero slideshow. Each slide crossfades and slowly zooms (the
             "slow zoom" the client liked), pure CSS — no JS, no flash of an
             empty hero. To change the photos, swap the four background-image
             URLs below; add or remove a slide and update the nth-child delays
             in .hero__slide (style.css) to match. The first photo is repeated
             on the wrapper so the very first frame is never blank — keep the
             two in step. Interim set is Élever's own photography until the
             Google Drive shots arrive. -->
        <div class="hero__slides" aria-hidden="true" style="background-image:url(&quot;assets/img/camps/camp-5.jpg&quot;)">
          <div class="hero__slide" style="background-image:url(&quot;assets/img/camps/camp-5.jpg&quot;)"></div>
          <div class="hero__slide" style="background-image:url(&quot;assets/img/events/joo-chiat-carnival-2026-12.jpg&quot;)"></div>
          <div class="hero__slide" style="background-image:url(&quot;assets/img/events/asics-summit-2026-3.jpg&quot;)"></div>
          <div class="hero__slide" style="background-image:url(&quot;assets/img/camps/camp-3.jpg&quot;)"></div>
        </div>
        <!-- Brand blue wash, in the spirit of the Development Pathway cards.
             Delete this one line if the supplied photos arrive already tinted. -->
        <div class="hero__tint" aria-hidden="true"></div>
        <div class="hero__overlay"></div>
        <div class="hero__inner">
          <div class="hero__content">
            <p class="hero__eyebrow reveal">Singapore</p>
            <h1 class="hero__title">
              <img class="hero__logo reveal" src="assets/img/brand/eb-logo-white.png" alt="Élever Badminton" />
            </h1>
            <p class="hero__sub reveal" data-delay="240">Enhance your skills. Enjoy the process. Elevate your experience.</p>
            <div class="hero__actions reveal" data-delay="320">
              <a href="about.html" class="btn btn--primary">About us</a>
            </div>
          </div>
        </div>
        <div class="hero__scroll" aria-hidden="true"><span></span>Scroll</div>
      </section>

      <!-- ===== WHAT WE DO — five photo tiles =====
           The "What we do" kicker and "Five pillars" heading were dropped at
           the client's request (Sep 2026); the heading below is kept for
           screen readers only so the section is still announced. The tiles sit
           in the standard content column (same width, gutter and rhythm as the
           Development Pathway cards) rather than bleeding full width. -->
      <section class="psec" aria-labelledby="whatwedo">
        <h2 class="sr-only" id="whatwedo">What we do</h2>
        <div class="pillars" id="pillarsGrid"></div>
      </section>

      <!-- ===== CTA ===== -->
      <section class="cta" id="contact">
        <div class="cta__inner">
          <h2 class="reveal">Ready to <em>elevate</em>?</h2>
          <p class="reveal" data-delay="120">Whether it's your first swing or your next title, there's a place for you at Élever Badminton.</p>
          <div class="cta__actions reveal" data-delay="200">
            <a href="https://app.eleverbadminton.com/" target="_blank" rel="noopener" class="btn btn--primary">Book a class</a>
            <a href="contact.html" class="btn btn--ghost">Talk to us</a>
          </div>
        </div>
      </section>

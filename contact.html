<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Élever Badminton</title>
  <meta name="description" content="Talk to Élever Badminton about classes, holiday camps, private coaching or a corporate badminton event in Singapore." />
  <meta property="og:title" content="Contact Élever Badminton" />
  <meta property="og:description" content="Talk to Élever Badminton about classes, holiday camps, private coaching or a corporate badminton event in Singapore." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.eleverbadminton.com/assets/img/hero-action.jpg" />
  <meta name="twitter:description" content="Talk to Élever Badminton about classes, holiday camps, private coaching or a corporate badminton event in Singapore." />
  <meta name="twitter:title" content="Contact Élever Badminton" />
  <meta property="og:image" content="https://www.eleverbadminton.com/assets/img/hero-action.jpg" />
  <meta property="og:url" content="https://www.eleverbadminton.com/contact" />
  <link rel="canonical" href="https://www.eleverbadminton.com/contact" />
  <link rel="icon" type="image/png" sizes="100x100" href="/assets/img/brand/eb-icon-blue.png?v=64" />
  <link rel="icon" href="/favicon.ico?v=64" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=64" />
  <link rel="stylesheet" href="assets/css/pages.css?v=67" />
</head>
<body data-page="contact" data-nav="solid" data-base="">

  <a href="#main" class="skip-link">Skip to main content</a>
  <header id="siteHeader"></header>

  <main id="main">
    <section class="phead phead--contact">
      <div class="phead__inner contact-hero">
        <h1>Get in touch</h1>
      </div>
    </section>

    <section class="psec contact-section">
      <div class="contact-shell">
        <form class="lead contact-form-card" id="contact-form" data-lead data-to="info@eleverbadminton.com" data-subject="Website enquiry" novalidate>
          <div class="contact-form-card__head">
            <div>
              <h2>Enquiry Form</h2>
              <p class="contact-form-card__required"><span aria-hidden="true">*</span> Required fields</p>
            </div>
          </div>
          <div class="lead__grid">
            <label class="lead__field" for="contact-name"><span>Name <b aria-hidden="true">*</b></span><input id="contact-name" type="text" name="Name" autocomplete="name" required></label>
            <label class="lead__field" for="contact-email"><span>Email <b aria-hidden="true">*</b></span><input id="contact-email" type="email" name="Email" autocomplete="email" required></label>
            <div class="lead__field contact-mobile-field"><span>Mobile</span>
              <div class="contact-phone" data-country-code-field>
                <select id="contact-country-code" name="Country code" autocomplete="tel-country-code" aria-label="Country code" data-country-code-select data-searchable-select="country-code">
                  <option value="+65" data-country="Singapore" data-country-code="SG" selected>🇸🇬 Singapore (SG) +65</option>
                  <option value="+61" data-country="Australia" data-country-code="AU">🇦🇺 Australia (AU) +61</option>
                  <option value="+880" data-country="Bangladesh" data-country-code="BD">🇧🇩 Bangladesh (BD) +880</option>
                  <option value="+55" data-country="Brazil" data-country-code="BR">🇧🇷 Brazil (BR) +55</option>
                  <option value="+673" data-country="Brunei" data-country-code="BN">🇧🇳 Brunei (BN) +673</option>
                  <option value="+855" data-country="Cambodia" data-country-code="KH">🇰🇭 Cambodia (KH) +855</option>
                  <option value="+1" data-country="Canada" data-country-code="CA">🇨🇦 Canada (CA) +1</option>
                  <option value="+86" data-country="China" data-country-code="CN">🇨🇳 China (CN) +86</option>
                  <option value="+45" data-country="Denmark" data-country-code="DK">🇩🇰 Denmark (DK) +45</option>
                  <option value="+358" data-country="Finland" data-country-code="FI">🇫🇮 Finland (FI) +358</option>
                  <option value="+33" data-country="France" data-country-code="FR">🇫🇷 France (FR) +33</option>
                  <option value="+49" data-country="Germany" data-country-code="DE">🇩🇪 Germany (DE) +49</option>
                  <option value="+852" data-country="Hong Kong" data-country-code="HK">🇭🇰 Hong Kong (HK) +852</option>
                  <option value="+91" data-country="India" data-country-code="IN">🇮🇳 India (IN) +91</option>
                  <option value="+62" data-country="Indonesia" data-country-code="ID">🇮🇩 Indonesia (ID) +62</option>
                  <option value="+353" data-country="Ireland" data-country-code="IE">🇮🇪 Ireland (IE) +353</option>
                  <option value="+39" data-country="Italy" data-country-code="IT">🇮🇹 Italy (IT) +39</option>
                  <option value="+81" data-country="Japan" data-country-code="JP">🇯🇵 Japan (JP) +81</option>
                  <option value="+856" data-country="Laos" data-country-code="LA">🇱🇦 Laos (LA) +856</option>
                  <option value="+853" data-country="Macau" data-country-code="MO">🇲🇴 Macau (MO) +853</option>
                  <option value="+60" data-country="Malaysia" data-country-code="MY">🇲🇾 Malaysia (MY) +60</option>
                  <option value="+52" data-country="Mexico" data-country-code="MX">🇲🇽 Mexico (MX) +52</option>
                  <option value="+95" data-country="Myanmar" data-country-code="MM">🇲🇲 Myanmar (MM) +95</option>
                  <option value="+977" data-country="Nepal" data-country-code="NP">🇳🇵 Nepal (NP) +977</option>
                  <option value="+31" data-country="Netherlands" data-country-code="NL">🇳🇱 Netherlands (NL) +31</option>
                  <option value="+64" data-country="New Zealand" data-country-code="NZ">🇳🇿 New Zealand (NZ) +64</option>
                  <option value="+47" data-country="Norway" data-country-code="NO">🇳🇴 Norway (NO) +47</option>
                  <option value="+92" data-country="Pakistan" data-country-code="PK">🇵🇰 Pakistan (PK) +92</option>
                  <option value="+63" data-country="Philippines" data-country-code="PH">🇵🇭 Philippines (PH) +63</option>
                  <option value="+974" data-country="Qatar" data-country-code="QA">🇶🇦 Qatar (QA) +974</option>
                  <option value="+966" data-country="Saudi Arabia" data-country-code="SA">🇸🇦 Saudi Arabia (SA) +966</option>
                  <option value="+27" data-country="South Africa" data-country-code="ZA">🇿🇦 South Africa (ZA) +27</option>
                  <option value="+82" data-country="South Korea" data-country-code="KR">🇰🇷 South Korea (KR) +82</option>
                  <option value="+34" data-country="Spain" data-country-code="ES">🇪🇸 Spain (ES) +34</option>
                  <option value="+94" data-country="Sri Lanka" data-country-code="LK">🇱🇰 Sri Lanka (LK) +94</option>
                  <option value="+46" data-country="Sweden" data-country-code="SE">🇸🇪 Sweden (SE) +46</option>
                  <option value="+41" data-country="Switzerland" data-country-code="CH">🇨🇭 Switzerland (CH) +41</option>
                  <option value="+886" data-country="Taiwan" data-country-code="TW">🇹🇼 Taiwan (TW) +886</option>
                  <option value="+66" data-country="Thailand" data-country-code="TH">🇹🇭 Thailand (TH) +66</option>
                  <option value="+971" data-country="United Arab Emirates" data-country-code="AE">🇦🇪 United Arab Emirates (AE) +971</option>
                  <option value="+44" data-country="United Kingdom" data-country-code="GB">🇬🇧 United Kingdom (GB) +44</option>
                  <option value="+1" data-country="United States" data-country-code="US">🇺🇸 United States (US) +1</option>
                  <option value="+84" data-country="Vietnam" data-country-code="VN">🇻🇳 Vietnam (VN) +84</option>
                </select>
                <input id="contact-mobile" type="tel" name="Mobile" autocomplete="tel-national" inputmode="tel" aria-label="Mobile number">
              </div>
            </div>
            <label class="lead__field contact-topic-field" for="contact-topic"><span>Enquiry type <b aria-hidden="true">*</b></span>
              <select id="contact-topic" name="Topic" required>
                <option value="" selected disabled>Choose an enquiry type</option>
                <option>Classes</option>
                <option>Events</option>
                <option>Careers</option>
                <option>Others</option>
              </select>
            </label>

            <fieldset class="contact-fields" id="contact-fields-classes" data-contact-panel="Classes" aria-label="Class enquiry details" hidden>
              <label class="lead__field" for="contact-student-name"><span>Name of student <b aria-hidden="true">*</b></span><input id="contact-student-name" type="text" name="Name of student" autocomplete="off" data-required></label>
              <label class="lead__field" for="contact-student-age"><span>Age of student <b aria-hidden="true">*</b></span><input id="contact-student-age" type="number" name="Age of student" min="3" max="99" inputmode="numeric" data-required></label>
              <label class="lead__field" for="contact-class-type"><span>Preferred class type <b aria-hidden="true">*</b></span>
                <select id="contact-class-type" name="Preferred class type" data-required><option value="" selected disabled>Choose a class type</option><option>Group Classes</option><option>Private Classes</option><option>Holiday Camps</option></select>
              </label>
              <label class="lead__field" for="contact-area"><span>Preferred area <b aria-hidden="true">*</b></span>
                <select id="contact-area" name="Preferred area" data-required><option value="" selected disabled>Choose an area</option><option>Central</option><option>East</option><option>West</option><option>North</option><option>North-East</option></select>
              </label>
              <label class="lead__field lead__field--wide" for="contact-class-message"><span>Your message</span><textarea id="contact-class-message" name="Message" rows="5" placeholder="Share your goals or preferred days."></textarea></label>
            </fieldset>

            <fieldset class="contact-fields" id="contact-fields-events" data-contact-panel="Events" aria-label="Event enquiry details" hidden>
              <label class="lead__field" for="contact-organisation"><span>Organisation <b aria-hidden="true">*</b></span><input id="contact-organisation" type="text" name="Organisation" autocomplete="organization" data-required></label>
              <label class="lead__field" for="contact-event-type"><span>Type of event <b aria-hidden="true">*</b></span>
                <select id="contact-event-type" name="Event type" data-required><option value="" selected disabled>Choose an event type</option><option>Carnival</option><option>Clinic</option><option>Competition</option></select>
              </label>
              <label class="lead__field lead__field--wide" for="contact-event-size"><span>Estimated number of participants</span><input id="contact-event-size" type="number" name="Estimated number of participants" min="1" inputmode="numeric"></label>
              <label class="lead__field lead__field--wide" for="contact-event-message"><span>Your message</span><textarea id="contact-event-message" name="Message" rows="5" placeholder="Share your preferred date, venue or event goals."></textarea></label>
            </fieldset>

            <fieldset class="contact-fields" id="contact-fields-careers" data-contact-panel="Careers" aria-label="Career enquiry details" hidden>
              <label class="lead__field" for="contact-applicant-age"><span>Age <b aria-hidden="true">*</b></span><input id="contact-applicant-age" type="number" name="Age" min="16" max="99" inputmode="numeric" data-required></label>
              <label class="lead__field" for="contact-role"><span>Role of interest <b aria-hidden="true">*</b></span>
                <select id="contact-role" name="Role of interest" data-required><option value="" selected disabled>Choose a role</option><option>Badminton Coach</option><option>Assistant Coach</option><option>Operations &amp; Events</option><option>Internship</option><option>Other</option></select>
              </label>
              <label class="lead__field lead__field--wide" for="contact-experience"><span>Relevant experience and qualifications <b aria-hidden="true">*</b></span><textarea id="contact-experience" name="Experience and qualifications" rows="4" placeholder="Tell us about your coaching, playing or relevant work experience." data-required></textarea></label>
              <label class="lead__field lead__field--wide" for="contact-availability"><span>Availability <b aria-hidden="true">*</b></span>
                <select id="contact-availability" name="Availability" data-required><option value="" selected disabled>Choose your availability</option><option>Immediately</option><option>Within one month</option><option>Within one to three months</option><option>Flexible</option></select>
              </label>
              <label class="lead__field lead__field--wide" for="contact-profile-link"><span>CV, portfolio or LinkedIn URL</span><input id="contact-profile-link" type="url" name="CV or profile URL" inputmode="url" placeholder="https://"></label>
              <label class="lead__field lead__field--wide" for="contact-career-message"><span>Your message</span><textarea id="contact-career-message" name="Message" rows="5" placeholder="Add anything else you would like us to know."></textarea></label>
            </fieldset>

            <fieldset class="contact-fields" id="contact-fields-others" data-contact-panel="Others" aria-label="Other enquiry details" hidden>
              <label class="lead__field lead__field--wide" for="contact-other-message"><span>Your message <b aria-hidden="true">*</b></span><textarea id="contact-other-message" name="Message" rows="5" placeholder="How can we help?" data-required></textarea></label>
            </fieldset>

            <label class="lead__consent"><input type="checkbox" name="consent" required>
              <span>I agree that Élever Badminton may contact me about this enquiry. See our <a href="privacy.html">privacy notice</a>. <b aria-hidden="true">*</b></span></label>
            <div class="lead__actions">
              <button class="btn btn--contact-send" type="submit">Send message <span class="cta-chevron" aria-hidden="true">&rsaquo;</span></button>
              <span class="lead__status" role="status" aria-live="polite"></span>
            </div>
          </div>
        </form>

        <aside class="contact-aside" aria-label="Other ways to contact Élever">
          <div class="contact-aside__intro">
            <h2>Prefer another route?</h2>
            <p>Choose the channel that feels easiest. You&rsquo;ll reach the same Élever team.</p>
          </div>
          <a class="contact-channel contact-channel--primary" href="https://wa.me/6589214221" target="_blank" rel="noopener">
            <span class="contact-channel__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M20 11.6a8 8 0 0 1-11.8 7L4 20l1.4-4.1A8 8 0 1 1 20 11.6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.8 8.3c.3 3 2 4.7 5 5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="contact-channel__body"><strong>WhatsApp</strong></span>
            <span class="contact-channel__arrow" aria-hidden="true">&gt;</span>
          </a>
          <a class="contact-channel" href="mailto:info@eleverbadminton.com">
            <span class="contact-channel__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m5 7 7 5 7-5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            </span>
            <span class="contact-channel__body"><strong>info@eleverbadminton.com</strong></span>
            <span class="contact-channel__arrow" aria-hidden="true">&gt;</span>
          </a>
          <div class="contact-event-card">
            <span class="contact-event-card__tag">For organisations</span>
            <h3>Planning a corporate or school event?</h3>
            <a href="#contact-form" data-contact-topic="Events">Start an event brief <span aria-hidden="true">&gt;</span></a>
          </div>
        </aside>
      </div>
    </section>

    <!-- The "Before you ask / Frequently asked" FAQ section was removed at the
         client's request (Aug 2026), pending a decision on whether to keep an
         FAQ at all. Recover the copy from git history if it comes back. -->

  </main>

  <footer id="siteFooter"></footer>

  <script src="assets/js/data.js?v=64"></script>
  <script src="assets/js/site.js?v=64"></script>
  <script src="assets/js/pages.js?v=65"></script>
  <script src="assets/js/main.js?v=64"></script>
</body>
</html>
